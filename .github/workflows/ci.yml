# CI = "continuous integration": the automatic checker.
# On every push and pull request, GitHub runs the same checks you can run
# by hand, and shows a green check or a red cross next to the commit.
# Needs no Azure and no secrets.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# This workflow only reads the code.
permissions:
  contents: read

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip # reuse downloaded packages between runs (faster)

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Check code style (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests (pytest)
        run: pytest

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/modules/ml-project
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Download the azurerm provider
        run: terraform init -backend=false -input=false

      - name: Check the configuration
        run: terraform validate

      - name: Run tests against a fake Azure (nothing is created)
        run: terraform test
